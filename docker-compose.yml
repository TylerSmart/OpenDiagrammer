name: open-diagrammer

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: open-diagrammer-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: OpenDiagrammer_Local_Dev_1
      MSSQL_PID: Developer
    ports:
      - "14333:1433"
    volumes:
      - open-diagrammer-sqlserver:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P OpenDiagrammer_Local_Dev_1 -C -Q \"SELECT 1\" -b -o /dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s


volumes:
  open-diagrammer-sqlserver:
