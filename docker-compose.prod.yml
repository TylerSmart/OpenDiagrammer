name: open-diagrammer-prod

services:
  api:
    build:
      context: .
      dockerfile: OpenDiagrammer.API/Dockerfile
    container_name: open-diagrammer-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=OpenDiagrammer;User Id=sa;Password=OpenDiagrammer_Prod_Password123!;TrustServerCertificate=True;"
      # Optional: JWT Secret (override in production)
      # Authentication__Jwt__Secret: "ReplaceWithStrongSecretKeyAtLeast32CharsLong!"
      # Optional: External OIDC / OAuth2 (e.g. Google, Authentik, Keycloak)
      # Authentication__Oidc__Enabled: "true"
      # Authentication__Oidc__ProviderName: "Google"
      # Authentication__Oidc__Authority: "https://accounts.google.com"
      # Authentication__Oidc__ClientId: "your-client-id.apps.googleusercontent.com"
      # Authentication__Oidc__ClientSecret: "your-client-secret"
      # Authentication__Oidc__Scope: "openid profile email"
      # Authentication__Oidc__AuthorizationEndpoint: "https://accounts.google.com/o/oauth2/v2/auth"
      # Authentication__Oidc__TokenEndpoint: "https://oauth2.googleapis.com/token"
      # Authentication__Oidc__UserInfoEndpoint: "https://openidconnect.googleapis.com/v1/userinfo"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: open-diagrammer-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: OpenDiagrammer_Prod_Password123!
      MSSQL_PID: Developer
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P OpenDiagrammer_Prod_Password123! -C -Q \"SELECT 1\" -b -o /dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

volumes:
  sqlserver_data:
