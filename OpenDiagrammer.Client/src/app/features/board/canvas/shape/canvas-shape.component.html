<div
  class="shape-container"
  [class.is-selected]="isSelected()"
  [style.transform]="shapeStyles().transform"
  [style.width]="shapeStyles().width"
  [style.height]="shapeStyles().height"
  [style.z-index]="shapeStyles().zIndex"
  (pointerenter)="isHovered.set(true)"
  (pointerleave)="isHovered.set(false)"
  (dblclick)="handleDoubleClick($event)"
>
  <svg class="shape-svg" [attr.viewBox]="'0 0 ' + shape().width + ' ' + shape().height">
    @switch (shape().type) {
      @case ('rectangle') {
        <rect
          x="1"
          y="1"
          [attr.width]="shape().width - 2"
          [attr.height]="shape().height - 2"
          [attr.fill]="shape().fillColor"
          [attr.stroke]="shape().strokeColor"
          [attr.stroke-width]="shape().strokeWidth"
        />
      }
      @case ('rounded-rectangle') {
        <rect
          x="1"
          y="1"
          rx="12"
          ry="12"
          [attr.width]="shape().width - 2"
          [attr.height]="shape().height - 2"
          [attr.fill]="shape().fillColor"
          [attr.stroke]="shape().strokeColor"
          [attr.stroke-width]="shape().strokeWidth"
        />
      }
      @case ('ellipse') {
        <ellipse
          [attr.cx]="shape().width / 2"
          [attr.cy]="shape().height / 2"
          [attr.rx]="(shape().width - 2) / 2"
          [attr.ry]="(shape().height - 2) / 2"
          [attr.fill]="shape().fillColor"
          [attr.stroke]="shape().strokeColor"
          [attr.stroke-width]="shape().strokeWidth"
        />
      }
      @case ('diamond') {
        <polygon
          [attr.points]="diamondPoints()"
          [attr.fill]="shape().fillColor"
          [attr.stroke]="shape().strokeColor"
          [attr.stroke-width]="shape().strokeWidth"
        />
      }
      @case ('triangle') {
        <polygon
          [attr.points]="trianglePoints()"
          [attr.fill]="shape().fillColor"
          [attr.stroke]="shape().strokeColor"
          [attr.stroke-width]="shape().strokeWidth"
        />
      }
      @case ('text-block') {
        <rect
          x="0"
          y="0"
          [attr.width]="shape().width"
          [attr.height]="shape().height"
          fill="transparent"
          stroke="none"
        />
      }
      @case ('flowchart-process') {
        <rect
          x="1"
          y="1"
          [attr.width]="shape().width - 2"
          [attr.height]="shape().height - 2"
          [attr.fill]="shape().fillColor"
          [attr.stroke]="shape().strokeColor"
          [attr.stroke-width]="shape().strokeWidth"
        />
      }
      @case ('flowchart-decision') {
        <polygon
          [attr.points]="diamondPoints()"
          [attr.fill]="shape().fillColor"
          [attr.stroke]="shape().strokeColor"
          [attr.stroke-width]="shape().strokeWidth"
        />
      }
      @case ('flowchart-terminal') {
        <rect
          x="1"
          y="1"
          [attr.rx]="shape().height / 2"
          [attr.ry]="shape().height / 2"
          [attr.width]="shape().width - 2"
          [attr.height]="shape().height - 2"
          [attr.fill]="shape().fillColor"
          [attr.stroke]="shape().strokeColor"
          [attr.stroke-width]="shape().strokeWidth"
        />
      }
      @case ('flowchart-io') {
        <polygon
          [attr.points]="flowchartIoPoints()"
          [attr.fill]="shape().fillColor"
          [attr.stroke]="shape().strokeColor"
          [attr.stroke-width]="shape().strokeWidth"
        />
      }
      @case ('flowchart-document') {
        <path
          [attr.d]="flowchartDocumentPath()"
          [attr.fill]="shape().fillColor"
          [attr.stroke]="shape().strokeColor"
          [attr.stroke-width]="shape().strokeWidth"
        />
      }
      @case ('flowchart-database') {
        <path
          [attr.d]="flowchartDatabaseBodyPath()"
          [attr.fill]="shape().fillColor"
          [attr.stroke]="shape().strokeColor"
          [attr.stroke-width]="shape().strokeWidth"
        />
        <ellipse
          [attr.cx]="shape().width / 2"
          [attr.cy]="flowchartDatabaseRy()"
          [attr.rx]="(shape().width - 2) / 2"
          [attr.ry]="flowchartDatabaseRy()"
          [attr.fill]="shape().fillColor"
          [attr.stroke]="shape().strokeColor"
          [attr.stroke-width]="shape().strokeWidth"
        />
      }
      @case ('uml-class') {
        <rect
          x="1"
          y="1"
          [attr.width]="shape().width - 2"
          [attr.height]="shape().height - 2"
          [attr.fill]="shape().fillColor"
          [attr.stroke]="shape().strokeColor"
          [attr.stroke-width]="shape().strokeWidth"
        />
        <line
          x1="1"
          [attr.y1]="umlClassDivider1()"
          [attr.x2]="shape().width - 1"
          [attr.y2]="umlClassDivider1()"
          [attr.stroke]="shape().strokeColor"
          [attr.stroke-width]="shape().strokeWidth"
        />
        <line
          x1="1"
          [attr.y1]="umlClassDivider2()"
          [attr.x2]="shape().width - 1"
          [attr.y2]="umlClassDivider2()"
          [attr.stroke]="shape().strokeColor"
          [attr.stroke-width]="shape().strokeWidth"
        />
      }
      @case ('uml-interface') {
        <rect
          x="1"
          y="1"
          [attr.width]="shape().width - 2"
          [attr.height]="shape().height - 2"
          [attr.fill]="shape().fillColor"
          [attr.stroke]="shape().strokeColor"
          [attr.stroke-width]="shape().strokeWidth"
        />
        <line
          x1="1"
          [attr.y1]="umlInterfaceDivider()"
          [attr.x2]="shape().width - 1"
          [attr.y2]="umlInterfaceDivider()"
          [attr.stroke]="shape().strokeColor"
          [attr.stroke-width]="shape().strokeWidth"
        />
      }
      @case ('uml-actor') {
        <circle
          [attr.cx]="shape().width / 2"
          [attr.cy]="shape().height * 0.2"
          [attr.r]="shape().height * 0.15"
          [attr.fill]="shape().fillColor"
          [attr.stroke]="shape().strokeColor"
          [attr.stroke-width]="shape().strokeWidth"
        />
        <line
          [attr.x1]="shape().width / 2"
          [attr.y1]="shape().height * 0.35"
          [attr.x2]="shape().width / 2"
          [attr.y2]="shape().height * 0.7"
          [attr.stroke]="shape().strokeColor"
          [attr.stroke-width]="shape().strokeWidth"
        />
        <line
          [attr.x1]="shape().width * 0.15"
          [attr.y1]="shape().height * 0.45"
          [attr.x2]="shape().width * 0.85"
          [attr.y2]="shape().height * 0.45"
          [attr.stroke]="shape().strokeColor"
          [attr.stroke-width]="shape().strokeWidth"
        />
        <line
          [attr.x1]="shape().width / 2"
          [attr.y1]="shape().height * 0.7"
          [attr.x2]="shape().width * 0.2"
          [attr.y2]="shape().height - 2"
          [attr.stroke]="shape().strokeColor"
          [attr.stroke-width]="shape().strokeWidth"
        />
        <line
          [attr.x1]="shape().width / 2"
          [attr.y1]="shape().height * 0.7"
          [attr.x2]="shape().width * 0.8"
          [attr.y2]="shape().height - 2"
          [attr.stroke]="shape().strokeColor"
          [attr.stroke-width]="shape().strokeWidth"
        />
      }
      @case ('uml-usecase') {
        <ellipse
          [attr.cx]="shape().width / 2"
          [attr.cy]="shape().height / 2"
          [attr.rx]="(shape().width - 2) / 2"
          [attr.ry]="(shape().height - 2) / 2"
          [attr.fill]="shape().fillColor"
          [attr.stroke]="shape().strokeColor"
          [attr.stroke-width]="shape().strokeWidth"
        />
      }
      @case ('uml-package') {
        <path
          [attr.d]="umlPackageTabPath()"
          [attr.fill]="shape().fillColor"
          [attr.stroke]="shape().strokeColor"
          [attr.stroke-width]="shape().strokeWidth"
        />
        <rect
          x="1"
          [attr.y]="umlPackageTabHeight()"
          [attr.width]="shape().width - 2"
          [attr.height]="shape().height - umlPackageTabHeight() - 1"
          [attr.fill]="shape().fillColor"
          [attr.stroke]="shape().strokeColor"
          [attr.stroke-width]="shape().strokeWidth"
        />
      }
      @case ('sticky-note') {
        <rect
          x="1"
          y="1"
          rx="4"
          ry="4"
          [attr.width]="shape().width - 2"
          [attr.height]="shape().height - 2"
          [attr.fill]="shape().fillColor"
          [attr.stroke]="shape().strokeColor"
          [attr.stroke-width]="shape().strokeWidth"
        />
      }
    }
  </svg>

  @if (shape().text && !isEditing()) {
    <div
      class="shape-text-overlay"
      [style.color]="textColor()"
      [style.font-size.px]="fittingFontSize()"
      [style.text-align]="shape().textAlign || 'center'"
      [style.font-weight]="shape().isBold ? 'bold' : null"
      [style.font-style]="shape().isItalic ? 'italic' : null"
      [style.text-decoration]="shape().isUnderline ? 'underline' : null"
      [innerHTML]="safeHtml()"
    ></div>
  }

  @if (shape().type === 'sticky-note' && shape().showAuthor !== false && shape().authorName) {
    <div class="sticky-author-badge" [attr.aria-label]="'Author: ' + shape().authorName">
      <span class="author-icon">✍</span>
      <span class="author-name">{{ shape().authorName }}</span>
    </div>
  }

  <!-- Connection Anchor Points (offset from the shape so resize and connection handles coexist cleanly) -->
  @if (showAnchors() || (allowHoverAnchors() && isHovered()) || isSelected()) {
    @for (anchor of anchors; track anchor) {
      <div
        class="shape-anchor anchor-{{ anchor }}"
        (pointerdown)="handleAnchorDown($event, anchor)"
        (pointerenter)="handleAnchorEnter(anchor)"
        (pointerleave)="handleAnchorLeave()"
        [attr.aria-label]="anchor + ' connection anchor'"
      ></div>
    }
  }
</div>
