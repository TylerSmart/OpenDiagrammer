<div
  class="canvas-viewport-area"
  [class.is-panning]="isPanning()"
  [class.is-space-pressed]="isSpacePressed"
>
  <!-- Infinite Grid/Dot background layer -->
  <div
    class="canvas-grid-layer"
    [class.bg-grid-lines]="isGridLines()"
    [class.bg-grid-dots]="isGridDots()"
    [style.backgroundColor]="backgroundStyles().backgroundColor"
    [style.opacity]="backgroundStyles().opacity"
    [style.backgroundPosition]="backgroundStyles().backgroundPosition"
    [style.backgroundSize]="backgroundStyles().backgroundSize || ''"
    aria-hidden="true"
  ></div>

  <!-- Transformable content layer -->
  <div class="canvas-content-layer" [style.transform]="contentTransform()">
    <ng-content></ng-content>

    <!-- Rendered SVG Connections Layer -->
    <svg class="canvas-connections-layer" aria-hidden="true">
      <defs>
        <marker
          id="arrow-marker"
          viewBox="0 0 10 10"
          refX="9"
          refY="5"
          markerWidth="6"
          markerHeight="6"
          orient="auto-start-reverse"
        >
          <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--mat-sys-on-surface, #333)" />
        </marker>
        <marker
          id="arrow-marker-selected"
          viewBox="0 0 10 10"
          refX="9"
          refY="5"
          markerWidth="6"
          markerHeight="6"
          orient="auto-start-reverse"
        >
          <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--mat-sys-primary, #1976d2)" />
        </marker>
      </defs>

      @for (conn of renderedConnections(); track conn.id) {
        <path
          class="connection-hit-area"
          [attr.d]="conn.path"
          (pointerdown)="handleConnectionPointerDown($event, conn.id)"
        />
        <path
          class="connection-path"
          [class.is-selected]="isConnectionSelected(conn.id)"
          [attr.d]="conn.path"
          [attr.stroke]="
            isConnectionSelected(conn.id) ? 'var(--mat-sys-primary)' : conn.strokeColor
          "
          [attr.stroke-width]="conn.strokeWidth"
          [attr.stroke-dasharray]="conn.dashArray || ''"
          [attr.marker-end]="
            isConnectionSelected(conn.id) ? 'url(#arrow-marker-selected)' : 'url(#arrow-marker)'
          "
          (pointerdown)="handleConnectionPointerDown($event, conn.id)"
        />
      }

      @if (inProgressConnection(); as inProg) {
        <path
          class="connection-path in-progress"
          [attr.d]="inProg.path"
          stroke="var(--mat-sys-primary)"
          stroke-width="2"
          stroke-dasharray="5,5"
          marker-end="url(#arrow-marker-selected)"
        />
      }
    </svg>

    <!-- Rendered Shapes -->
    @for (shape of shapes(); track shape.id) {
      <app-canvas-shape
        [shape]="shape"
        [isSelected]="isShapeSelected(shape.id)"
        [showAnchors]="
          activeTool() === 'connection' ||
          isShapeSelected(shape.id) ||
          inProgressConnection() !== null
        "
        (pointerdown)="handleShapePointerDown($event, shape)"
        (anchorPointerDown)="handleAnchorPointerDown($event)"
        (anchorHover)="handleAnchorHover($event)"
      ></app-canvas-shape>
    }

    <!-- Selection Bounding Box & Resize Handles -->
    @if (selectionBox(); as box) {
      <div
        class="selection-box"
        [style.left.px]="box.minX"
        [style.top.px]="box.minY"
        [style.width.px]="box.width"
        [style.height.px]="box.height"
      >
        @if (selectedShapeIds().size === 1) {
          @for (pos of resizeHandles; track pos) {
            <div
              class="resize-handle handle-{{ pos }}"
              (pointerdown)="handleResizePointerDown($event, pos)"
            ></div>
          }
        }
      </div>
    }

    <!-- Drag Selection Marquee Rectangle -->
    @if (marqueeBox(); as marquee) {
      <div
        class="marquee-rectangle"
        [style.left.px]="marquee.minX"
        [style.top.px]="marquee.minY"
        [style.width.px]="marquee.width"
        [style.height.px]="marquee.height"
      ></div>
    }
  </div>

  <!-- Top Shape Creation Tool Palette Dock -->
  <div
    class="canvas-tools-dock"
    role="toolbar"
    aria-label="Shape creation tools"
    (pointerdown)="$event.stopPropagation()"
  >
    <button
      mat-icon-button
      class="tool-btn"
      [class.active]="activeTool() === 'select'"
      (click)="setActiveTool('select')"
      aria-label="Selection Tool"
      matTooltip="Select tool (V)"
    >
      <mat-icon>near_me</mat-icon>
    </button>

    <div class="dock-divider"></div>

    <button
      mat-icon-button
      class="tool-btn"
      [class.active]="activeTool() === 'connection'"
      (click)="setActiveTool('connection')"
      aria-label="Connection Tool"
      matTooltip="Connector Line / Arrow (C)"
    >
      <mat-icon>trending_flat</mat-icon>
    </button>

    <div class="dock-divider"></div>

    <button
      mat-icon-button
      class="tool-btn"
      [class.active]="activeTool() === 'rectangle'"
      (click)="setActiveTool('rectangle')"
      aria-label="Add Rectangle"
      matTooltip="Rectangle (R)"
    >
      <mat-icon>crop_square</mat-icon>
    </button>

    <button
      mat-icon-button
      class="tool-btn"
      [class.active]="activeTool() === 'rounded-rectangle'"
      (click)="setActiveTool('rounded-rectangle')"
      aria-label="Add Rounded Rectangle"
      matTooltip="Rounded Rectangle"
    >
      <mat-icon>square</mat-icon>
    </button>

    <button
      mat-icon-button
      class="tool-btn"
      [class.active]="activeTool() === 'ellipse'"
      (click)="setActiveTool('ellipse')"
      aria-label="Add Ellipse/Circle"
      matTooltip="Circle / Ellipse (O)"
    >
      <mat-icon>panorama_fish_eye</mat-icon>
    </button>

    <button
      mat-icon-button
      class="tool-btn"
      [class.active]="activeTool() === 'diamond'"
      (click)="setActiveTool('diamond')"
      aria-label="Add Diamond"
      matTooltip="Diamond / Decision (D)"
    >
      <mat-icon>change_history</mat-icon>
    </button>
  </div>

  <!-- Floating Canvas Controls Dock (Bottom Left) -->
  <div
    class="canvas-controls-dock"
    role="toolbar"
    aria-label="Canvas zoom and view controls"
    (pointerdown)="$event.stopPropagation()"
  >
    <button
      mat-icon-button
      class="control-btn"
      (click)="zoomOut()"
      aria-label="Zoom out (Ctrl + -)"
      matTooltip="Zoom out"
    >
      <mat-icon>remove</mat-icon>
    </button>

    <button
      mat-button
      class="zoom-level-btn"
      (click)="resetZoom()"
      aria-label="Reset zoom to 100% (Ctrl + 0)"
      matTooltip="Reset zoom to 100%"
    >
      <span>{{ zoomPercentage() }}</span>
    </button>

    <button
      mat-icon-button
      class="control-btn"
      (click)="zoomIn()"
      aria-label="Zoom in (Ctrl + +)"
      matTooltip="Zoom in"
    >
      <mat-icon>add</mat-icon>
    </button>

    <div class="dock-divider"></div>

    <button
      mat-icon-button
      class="control-btn"
      (click)="resetView()"
      aria-label="Reset view to origin"
      matTooltip="Reset view (origin)"
    >
      <mat-icon>filter_center_focus</mat-icon>
    </button>
  </div>
</div>
